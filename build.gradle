// 빌드 도구(Gradle 플러그인) classpath에만 적용하는 버전 보완입니다. 앱 runtimeClasspath에는 영향이 없습니다. (#144)
// - spring-boot-gradle-plugin → spring-boot-buildpack-platform → commons-compress 1.27.1 경로로 commons-lang3 3.16.0이 들어옵니다.
//   3.16.0은 ClassUtils.getClass 재귀 취약점(CVE-2025-48924, 3.18.0에서 수정) 대상이라 Dependabot 경고가 납니다.
// - Spring Boot 4.1.3에서도 이 경로는 3.16.0 그대로라, 앱과 같은 3.20.0(Spring Boot 관리 버전)으로 맞춥니다.
// - Spring Boot 업그레이드 후 이 경로가 3.18.0 이상으로 바뀌면 이 블록을 지웁니다. (./gradlew buildEnvironment로 확인)
buildscript {
	configurations.classpath {
		resolutionStrategy.force 'org.apache.commons:commons-lang3:3.20.0'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gyeot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// 배포 헬스 체크 (/actuator/health)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// DB 마이그레이션 (#47에서 V1 작성 후 활성화)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// API 문서 (Swagger UI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '-Duser.timezone=Asia/Seoul' // 테스트는 main()을 거치지 않아서 여기서 시간대를 따로 고정
}

// 실행용 jar(bootJar)만 만들고 plain jar는 만들지 않음 (Docker 이미지에 jar 하나만 복사)
tasks.named('jar') {
	enabled = false
}
