name: Deploy

# develop의 CI가 성공하면 개발 서버(EC2)에 배포합니다.
# 흐름: 최신 커밋 확인 → jar 빌드 → GHCR 이미지 푸시 → (OIDC) SSH 임시 허용 → EC2에서 compose pull/up → 헬스 체크 → SSH 허용 해제
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_SG_ID, AWS_DEPLOY_ROLE_ARN
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ develop ]
  workflow_dispatch:  # Actions 탭에서 수동 실행도 가능

# GITHUB_TOKEN 권한: 기본은 읽기만 두고, 쓰기 권한은 실제로 쓰는 job에만 줌 (최소 권한)
# job에 permissions를 적으면 이 값은 무시되고 job에 적은 권한만 적용됨 (적지 않은 권한은 none)
#  - check-latest: 조회만 (커밋·CI 기록)
#  - deploy: 이미지 푸시, AWS 임시 권한
permissions:
  contents: read

# 배포는 한 번에 하나만 실행 (임시 SSH 규칙이 서로 겹치지 않게)
# 기본값은 대기 실행을 1개만 남기고, 새 실행이 오면 대기 중이던 실행을 취소함
#  → 최신 커밋 실행이 대기 중일 때 옛 커밋 실행이 들어오면 최신 실행이 취소되고, 옛 실행은 아래 최신 확인에서 건너뛰어 아무것도 배포되지 않음
# queue: max로 대기 실행을 취소하지 않고 모두 순서대로 실행 (그룹당 최대 100개, cancel-in-progress가 false일 때만 적용)
concurrency:
  group: deploy-dev
  cancel-in-progress: false  # 실행 중인 배포는 중간에 취소하지 않음
  queue: max                 # 대기 중인 배포도 취소하지 않고 모두 차례로 실행

env:
  IMAGE: ghcr.io/llszos/likelion_14th_2swu_be  # GHCR 이미지 이름은 소문자만 허용
  AWS_REGION: ap-northeast-2

jobs:

  # --- 1단계: 이번에 배포할 커밋이 배포해도 되는 커밋인지 확인 (develop 최신 + 수동 실행이면 CI 성공) ---
  # 이전 커밋의 CI가 늦게 끝나면, 새 버전이 배포된 뒤 옛 버전이 다시 배포될 수 있음
  # concurrency(queue: max)로 모든 배포가 취소 없이 하나씩 실행되므로, 실행이 시작될 때 최신인지 보면 됨
  #  - 옛 커밋 실행: 자기 차례에 최신이 아니라서 건너뜀
  #  - 최신 커밋 실행: 대기열에서 취소되지 않으므로 반드시 자기 차례가 와서 배포됨
  #  - 이 실행이 확인한 뒤에 새 커밋이 올라오면, 그 커밋의 배포가 대기열에 들어가 이 실행 다음에 실행됨
  check-latest:

    # push로 실행된 CI가 성공했을 때만 (PR CI는 제외)
    # 수동 실행은 develop에서만 (다른 브랜치 이미지가 latest로 올라가지 않게)
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    runs-on: ubuntu-latest  # GitHub이 빌려주는 리눅스 가상 컴퓨터에서 실행 (곁 서버가 아님, gh CLI 기본 설치)
    timeout-minutes: 5      # API 조회 1번이라 오래 걸릴 일 없음, 멈추면 대기열이 막히지 않게 종료
    # 조회만 하므로 읽기 권한만 (이미지 푸시·AWS 권한은 주지 않음)
    permissions:
      contents: read   # develop 최신 커밋 조회
      actions: read    # 수동 실행 시 CI 실행 기록 조회 (적지 않으면 none이 되어 조회가 막힐 수 있음)

    # job끼리는 서로 다른 가상 컴퓨터에서 실행되어 변수를 공유할 수 없으므로, 결과를 outputs로 내보냄
    # deploy job은 needs.check-latest.outputs.deployable로 이 값을 읽음
    outputs:
      deployable: ${{ steps.compare.outputs.deployable }}  # 아래 compare 단계가 정한 값 (true / false)

    steps:
      - name: Check latest commit and CI result  # Actions 화면에 보이는 단계 이름
        id: compare                                # 위 outputs에서 이 단계를 가리키는 이름

        env:
          # GitHub이 실행마다 자동으로 만들어 주는 임시 토큰 (따로 등록하는 Secret 아님, 실행이 끝나면 만료)
          # gh CLI가 GitHub API를 호출할 때 이 이름의 환경변수를 읽음
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 이번에 배포하려는 커밋
          #  - CI 완료로 시작: CI가 검사한 커밋(head_sha)
          #  - 수동 실행: 지금 develop 커밋(github.sha)
          #  - `||`는 앞 값이 비어 있으면 뒤 값을 쓴다는 뜻
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

          # 이 실행이 어떻게 시작됐는지 (workflow_run: CI 완료, workflow_dispatch: 수동 실행)
          EVENT: ${{ github.event_name }}

        run: |
          # 1. GitHub API로 develop 브랜치의 "지금" 최신 커밋을 조회하고, 커밋 번호(sha)만 꺼냄
          #    github.repository는 llszos/LIKELION_14th_2SWU_BE로 바뀜
          LATEST=$(gh api "repos/${{ github.repository }}/commits/develop" --jq .sha)

          # 2. 배포하려는 커밋이 최신이 아니면 건너뜀
          #    결과는 $GITHUB_OUTPUT 파일에 "이름=값" 형태로 적어야 위 outputs에서 읽을 수 있음
          #    실패(exit 1)로 끝내지 않아 실행은 성공으로 표시되고,
          #    ::notice:: 줄은 Actions 실행 화면 맨 위에 안내 상자로 보여서 건너뛴 이유를 알 수 있음
          if [ "$LATEST" != "$SHA" ]; then
            echo "::notice::배포 건너뜀: $SHA 는 develop 최신 커밋($LATEST)이 아닙니다."
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. 수동 실행이면 이 커밋의 CI가 성공했는지 확인
          #    CI 완료로 시작한 실행은 위 if 조건에서 이미 성공을 확인했으므로 생략
          #    (방금 끝난 CI가 API 목록에 늦게 반영되면 최신 배포를 잘못 건너뛸 수 있어서 다시 조회하지 않음)
          #    branch=develop·event=push·status=success로 걸러서, 같은 커밋의 PR CI 성공이나 다른 워크플로는 인정하지 않음
          if [ "$EVENT" = "workflow_dispatch" ]; then
            CI_SUCCESS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?head_sha=$SHA&branch=develop&event=push&status=success" --jq .total_count)
            if [ "$CI_SUCCESS" = "0" ]; then
              echo "::notice::배포 건너뜀: $SHA 는 develop push CI 성공 기록이 없습니다."
              echo "deployable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "deployable=true" >> "$GITHUB_OUTPUT"   # 최신이고 CI 통과 → deploy 실행

  # --- 2단계: 배포해도 되는 커밋일 때만 빌드·배포 ---
  deploy:
    needs: check-latest                                    # 1단계가 끝난 뒤 실행
    if: needs.check-latest.outputs.deployable == 'true'   # 최신이고 CI를 통과한 커밋일 때만
    runs-on: ubuntu-latest  # GitHub이 빌려주는 리눅스 가상 컴퓨터에서 빌드 (서버 배포는 아래 SSH 단계에서)

    # 기본 제한(6시간) 대신 20분: 빌드·이미지 푸시·배포 + 헬스 체크(최대 2분) 기준 여유 있게 잡은 값 (첫 배포 소요 시간 보고 조정)
    # 배포가 멈추면 뒤의 대기 실행(queue: max)이 전부 막히므로 짧게 끊음 (SSH 규칙이 남아도 다음 실행의 "Remove stale" 단계가 삭제)
    timeout-minutes: 20
    # 빌드·푸시·배포에 필요한 권한만
    permissions:
      contents: read    # 코드 checkout
      packages: write   # GHCR 이미지 푸시 (서버로 넘기는 GHCR_TOKEN도 이 권한으로 이미지를 받음)
      id-token: write   # AWS OIDC (액세스 키 없이 임시 권한)

    env:
      # CI가 검사한 커밋 그대로 배포 (수동 실행이면 현재 커밋)
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SG_ID: ${{ secrets.EC2_SG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build jar
        run: ./gradlew bootJar  # 테스트는 CI에서 이미 통과

      # GitHub 컨테이너 저장소(GHCR) 로그인 (GITHUB_TOKEN 사용)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile로 이미지를 만들어 latest와 커밋 SHA 태그로 푸시
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}

      # --- 배포하는 동안만 이 러너의 IP로 SSH(22)를 엽니다 ---
      # AWS 액세스 키 없이 gyeot-github-deploy 역할을 임시로 받음 (develop 브랜치에서만 허용)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove stale temporary SSH rules
        run: |
          # 이전 실행이 강제 종료되어 남은 gha- 규칙 정리 
          STALE=$(aws ec2 describe-security-group-rules \
            --filters Name=group-id,Values="$SG_ID" \
            --query "SecurityGroupRules[?Description && starts_with(Description, 'gha-')].SecurityGroupRuleId" \
            --output text)
          if [ -n "$STALE" ] && [ "$STALE" != "None" ]; then
            aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids $STALE
            echo "removed: $STALE"
          fi

      # 이 러너의 공인 IP만 22번에 추가하고, 규칙 ID를 다음 단계로 넘김
      - name: Allow SSH from this runner
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          RULE_ID=$(aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=gha-${{ github.run_id }}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "RULE_ID=$RULE_ID" >> "$GITHUB_ENV"

      # EC2에 접속해 새 이미지로 app 컨테이너만 교체 (서버의 ~/gyeot/docker-compose.yml, .env 사용)
      # 헬스 체크가 실패하면 마지막으로 성공한 버전으로 자동 롤백하고, 이 실행은 실패로 표시
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_TAG: ${{ env.SHA }}   # 배포할 커밋 SHA. Compose가 읽는 IMAGE_TAG와 이름을 나눔 (서버 스크립트 첫 부분 설명)
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}   # 서버에서 오래된 앱 이미지를 정리할 때 사용
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_TAG,GHCR_USER,GHCR_TOKEN,APP_IMAGE
          # script_stop은 쓰지 않음 (이 액션에서 제거된 옵션). 실패 처리는 아래에서 명령마다 직접 함
          script: |
            cd ~/gyeot || exit 1
            
            # Compose는 셸 환경변수를 .env보다 우선해서 씀 → 셸에 IMAGE_TAG가 있으면 .env를 바꿔도 그 값으로 이미지를 고름
            # (롤백 때 .env를 직전 태그로 바꿔도 실패한 새 이미지가 다시 뜸) → 배포 태그는 DEPLOY_TAG로 받고, IMAGE_TAG는 .env에서만 읽게 셸에서 지움
            unset IMAGE_TAG
            [ -n "$APP_IMAGE" ] || { echo "APP_IMAGE 값이 없음"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || exit 1

            # 지정한 태그로 app만 교체하고 정상인지 확인 (배포·롤백 공통)
            #  1. .env의 IMAGE_TAG를 바꾸고 이미지 받기 (롤백 때 지워진 이미지도 GHCR에서 다시 받음)
            #  2. --no-deps: nginx는 그대로 두고 app만 다시 만듦
            #  3. nginx는 app 주소(IP)를 켤 때 한 번만 찾으므로, app이 새로 만들어지면 reload로 다시 찾게 함
            #     켜져 있으면 reload (실패하면 설정 오류 등이므로 그대로 실패 처리)
            #     꺼져 있으면 새로 띄움 (새로 뜰 때 app 주소를 찾음)
            #  4. 헬스 체크: nginx를 거쳐 최대 약 2분 대기 (nginx 연결 문제도 여기서 잡힘)
            switch_to() {
              
              # .env의 IMAGE_TAG 줄이 정확히 하나 있어야 함. 없으면 sed가 아무것도 바꾸지 않고도 성공으로 끝나서,
              # compose 기본값(latest)으로 뜬 이미지를 새 태그로 착각하고 성공으로 기록할 수 있음
              [ "$(grep -c '^IMAGE_TAG=' .env)" = "1" ] || { echo "IMAGE_TAG 항목이 .env에 없거나 여러 개"; return 1; }
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env || return 1
              
              # sed 성공이 값 변경을 뜻하지는 않으므로 실제로 바뀌었는지 확인
              grep -qx "IMAGE_TAG=$1" .env || { echo "IMAGE_TAG 변경 실패: $1"; return 1; }

              docker compose pull app || return 1
              docker compose up -d --no-deps app || return 1
              
              # 실제로 실행 중인 app 이미지가 이번 태그인지 확인 (다른 값으로 이미지가 골라져도 성공으로 넘어가지 않게)
              RUNNING=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q app)") || return 1
              [ "$RUNNING" = "$APP_IMAGE:$1" ] || { echo "실행 이미지 불일치: $RUNNING (기대: $APP_IMAGE:$1)"; return 1; }
              
              if [ -n "$(docker compose ps --status running -q nginx)" ]; then
                docker compose exec -T nginx nginx -s reload || return 1
              else
                docker compose up -d --no-deps nginx || return 1
              fi
              
              for i in $(seq 1 24); do
                curl -fsS http://localhost/actuator/health | grep -q '"UP"' && return 0
                sleep 5
              done
              return 1
            }

            # 롤백 기준: 헬스 체크까지 통과한 마지막 태그 (실패한 버전으로 되돌아가지 않도록 .env와 따로 기록)
            # 첫 배포라 기록이 없으면 빈 값
            LAST_GOOD=$(cat .last_good_tag 2>/dev/null || true)

            if switch_to "$DEPLOY_TAG"; then
              
              # 성공한 경우에만 롤백 기준을 갱신. 임시 파일에 쓴 뒤 바꿔치기해서, 쓰다 실패해도 기존 기록은 그대로 둠
              # 기록에 실패하면 새 버전은 정상이므로 롤백하지 않고, 이 실행을 실패로 표시해 직접 확인하게 함
              if ! { printf '%s\n' "$DEPLOY_TAG" > .last_good_tag.tmp \
                     && mv -f .last_good_tag.tmp .last_good_tag \
                     && [ "$(cat .last_good_tag)" = "$DEPLOY_TAG" ]; }; then
                rm -f .last_good_tag.tmp
                echo "LAST_GOOD_TAG WRITE FAILED: $DEPLOY_TAG 는 정상 실행 중이지만 롤백 기준이 갱신되지 않음 (서버에서 .last_good_tag 확인 필요)"
                docker logout ghcr.io
                exit 1
              fi
              
              echo "health: UP ($DEPLOY_TAG)"
              
              # 쓰지 않는 앱 이미지 정리 (디스크 확보)
              # 배포 이미지는 SHA 태그가 붙어 있어 prune -f(태그 없는 이미지만 삭제)로는 지워지지 않음
              # 이번 태그와 직전 성공 태그(수동으로 되돌릴 때 바로 쓰도록)만 남기고 삭제. 지운 이미지가 필요하면 GHCR에서 다시 받음
              # 정리에 실패해도 배포 결과에는 영향이 없으므로 경고만 남김
              # APP_IMAGE가 비어 있으면 docker images가 서버의 모든 이미지를 나열하므로 정리하지 않음
              if [ -n "$APP_IMAGE" ]; then   # 위에서 이미 확인했지만, 비면 서버 전체 이미지가 대상이 되므로 한 번 더 막음
                for t in $(docker images "$APP_IMAGE" --format '{{.Tag}}'); do
                  if [ "$t" = "$DEPLOY_TAG" ] || [ "$t" = "$LAST_GOOD" ] || [ "$t" = "<none>" ]; then continue; fi
                  docker rmi "$APP_IMAGE:$t" > /dev/null || echo "warn: 이미지 삭제 실패 ($APP_IMAGE:$t)"
                done
              else
                echo "warn: APP_IMAGE 값이 없어 이미지 정리를 건너뜀"
              fi
              
              docker image prune -f > /dev/null || echo "warn: 태그 없는 이미지 정리 실패"
              docker logout ghcr.io
              exit 0
            fi

            echo "deploy failed: $DEPLOY_TAG"
            docker compose logs --tail 200 app

            # 마지막 성공 태그가 있고 이번 태그와 다를 때만 롤백
            if [ -n "$LAST_GOOD" ] && [ "$LAST_GOOD" != "$DEPLOY_TAG" ]; then
              if switch_to "$LAST_GOOD"; then
                echo "rolled back to $LAST_GOOD"
              else
                echo "ROLLBACK FAILED: $LAST_GOOD (서버에서 직접 확인 필요)"
                docker compose logs --tail 100 app
              fi
            else
              echo "rollback skipped: 마지막 성공 태그 없음"
            fi

            docker logout ghcr.io
            exit 1   # 롤백에 성공해도 이번 배포는 실패이므로 실패로 표시

      # 배포 성공·실패와 관계없이 이 실행이 연 SSH 규칙 삭제
      - name: Remove SSH rule for this runner
        if: always() && env.RULE_ID != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID"
