# Nginx가 HTTPS를 받아 HTTP로 앱에 전달하므로,
# Nginx가 넘겨준 X-Forwarded-Proto 등을 원래 요청 정보로 사용 (#81)
# - native: Tomcat의 기본 프록시 신뢰 설정을 사용
#   Docker 네트워크만 따로 신뢰하도록 제한한 설정은 아님
# - 결과: Swagger 요청 주소와 리다이렉트가 https로 만들어짐
server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
gyeot:
  security:
    cookie:
      secure: ${COOKIE_SECURE:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

  invitation:
    base-url: ${INVITATION_BASE_URL}
