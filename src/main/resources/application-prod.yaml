# Nginx가 HTTPS를 받아 HTTP로 앱에 전달하므로, Nginx가 넘겨준 X-Forwarded-Proto 등을 원래 요청 정보로 사용 (#81)
# native: Tomcat이 내부 대역(Docker 네트워크 등)에서 온 프록시 헤더만 믿음. Swagger 요청 주소와 리다이렉트가 https로 만들어짐
server:
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
gyeot:
  security:
    cookie:
      secure: ${COOKIE_SECURE:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

  invitation:
    base-url: ${INVITATION_BASE_URL}
