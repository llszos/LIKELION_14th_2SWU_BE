spring:
  application:
    name: gyeot
  profiles:
    default: local
  flyway:
    enabled: false  # #47에서 V1 작성 후 활성화
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul  # DB에 시각을 저장하고 읽을 때 기준 시간대

management:
  endpoints:
    web:
      exposure:
        include: health  # 배포 헬스 체크용, 다른 엔드포인트는 노출하지 않음
  endpoint:
    health:
      show-details: never

gyeot:
  invitation:
    base-url: ${INVITATION_BASE_URL:http://localhost:5173/invitations}

  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:gyeot}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    cookie:
      refresh-token-name: ${REFRESH_COOKIE_NAME:refresh_token}
      path: ${REFRESH_COOKIE_PATH:/api/auth}
      domain: ${COOKIE_DOMAIN:}
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 안심카드 항목 저장 암호화 키 (#37). Base64로 인코딩한 32바이트(AES-256)
# 운영은 환경변수로만 주입하고, 없거나 형식이 틀리면 서버가 시작되지 않음
safety-info:
  encryption-key: ${SAFETY_INFO_ENCRYPTION_KEY:}
