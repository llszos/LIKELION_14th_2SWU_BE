# 개발 서버(EC2)의 ~/gyeot/docker-compose.yml (기록용 사본)
# - 실제 배포는 서버에 있는 파일을 사용합니다. 이 파일을 고치면 서버 파일도 함께 수정해 주세요.
# - 비밀값은 같은 폴더의 .env에 두고 저장소에 커밋하지 않습니다. (예시: deploy/.env.example)
services:
  # 곁 Spring Boot 애플리케이션
  app:
    # GHCR 이미지. IMAGE_TAG는 배포 워크플로가 .env에 커밋 SHA로 넣습니다. (없으면 latest)
    image: ghcr.io/llszos/likelion_14th_2swu_be:${IMAGE_TAG:-latest}
    container_name: gyeot-app
    # 서버 재부팅이나 오류로 꺼져도 자동으로 다시 실행
    restart: unless-stopped
    # DB 접속 정보, JWT_SECRET 등 환경변수
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # EC2(t3.small, 2GB)에서 nginx·OS 몫을 남기기 위한 메모리 상한
    mem_limit: 1g
    # 외부에 직접 열지 않고, 같은 compose 네트워크의 nginx에만 공개
    expose:
      - "8080"
    # 로그 파일이 디스크를 채우지 않도록 10MB x 3개까지만 보관
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 외부 요청(80)을 app(8080)으로 전달하는 리버스 프록시. HTTPS도 여기서 처리할 예정
  nginx:
    image: nginx:1.27-alpine
    container_name: gyeot-nginx
    restart: unless-stopped
    depends_on:
      - app
    # 서버 80번 포트 → nginx (보안 그룹에서 80·443 허용)
    ports:
      - "80:80"
    # 서버의 nginx 설정 파일을 읽기 전용으로 연결
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
