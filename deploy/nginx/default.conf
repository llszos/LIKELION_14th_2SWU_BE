# 개발 서버(EC2)의 ~/gyeot/nginx/default.conf (기록용 사본)
# - 실제 배포는 서버에 있는 파일을 사용합니다. 이 파일을 고치면 서버 파일도 함께 수정해 주세요.
# - api.gyeot.shop은 HTTPS(443)로 받고, HTTP(80)는 인증서 확인 경로와 헬스 체크만 처리한 뒤 나머지를 HTTPS로 이동합니다. (#81)
#
# 인증서 (Let's Encrypt, certbot 컨테이너, webroot 방식)
# - 인증서와 키는 서버의 ~/gyeot/certbot/conf (컨테이너 안 /etc/letsencrypt)에 있고, 저장소에 커밋하지 않습니다.
# - 처음 발급: ~/gyeot에서
#   docker run --rm -v "$PWD/certbot/www:/var/www/certbot" -v "$PWD/certbot/conf:/etc/letsencrypt" certbot/certbot \
#     certonly --webroot -w /var/www/certbot -d api.gyeot.shop --email <관리자 이메일> --agree-tos --no-eff-email
# - 자동 갱신: ubuntu 사용자 crontab에 아래 줄을 등록했습니다. (crontab -l로 확인, 하루 두 번 03:17, 15:17 서버 시간)
#   17 3,15 * * * docker run --rm -v /home/ubuntu/gyeot/certbot/www:/var/www/certbot -v /home/ubuntu/gyeot/certbot/conf:/etc/letsencrypt certbot/certbot renew --webroot -w /var/www/certbot --quiet && cd /home/ubuntu/gyeot && docker compose exec -T nginx nginx -s reload >> /home/ubuntu/gyeot/certbot/renew.log 2>&1
#   갱신 필요 여부는 Certbot이 판단합니다. renew가 성공하면 실제 갱신 여부와 관계없이 nginx를 reload하며, reload 결과는 ~/gyeot/certbot/renew.log에 남습니다.
#   직접 확인할 때는 renew에 --dry-run --no-random-sleep-on-renew를 붙여 실행합니다. (붙이지 않으면 갱신 전 최대 8분 무작위 대기)

# HTTP(80): 인증서 확인 경로와 서버 내부 헬스 체크만 그대로 처리하고, 나머지는 HTTPS로 이동
server {
    listen 80;
    # IP로 접속한 요청도 받아 HTTPS 도메인으로 보냄
    server_name _;

    # Let's Encrypt 도메인 확인용 (인증서 발급과 갱신). certbot이 ~/gyeot/certbot/www에 확인 파일을 둠
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 배포 워크플로가 서버 안에서 http://localhost/actuator/health 로 확인하므로 이동하지 않음
    location = /actuator/health {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 요청은 HTTPS 주소로 이동 (308: POST 등 메서드와 본문 유지)
    location / {
        return 308 https://api.gyeot.shop$request_uri;
    }
}

# HTTPS(443): api.gyeot.shop
server {
    listen 443 ssl;
    http2 on;
    server_name api.gyeot.shop;

    ssl_certificate     /etc/letsencrypt/live/api.gyeot.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gyeot.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 요청 본문 최대 크기
    client_max_body_size 10m;

    # 모든 요청을 Spring Boot 컨테이너(app:8080)로 전달
    location / {
        proxy_pass http://app:8080;
        # 원래 요청 정보를 애플리케이션에 전달 (클라이언트 IP, https 여부. 앱은 forward-headers-strategy로 사용)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
