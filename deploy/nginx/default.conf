# 개발 서버(EC2)의 ~/gyeot/nginx/default.conf (기록용 사본)
# 빈 배포(HTTP)용 설정. HTTPS(Let's Encrypt)는 도메인 연결 후 추가합니다.
server {
    listen 80;
    # 도메인이 없으므로 모든 호스트 이름(IP 접속 포함)을 받음
    server_name _;

    # 요청 본문 최대 크기
    client_max_body_size 10m;

    # 모든 요청을 Spring Boot 컨테이너(app:8080)로 전달
    location / {
        proxy_pass http://app:8080;
        # 원래 요청 정보를 애플리케이션에 전달 (클라이언트 IP, http/https 구분 등)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
